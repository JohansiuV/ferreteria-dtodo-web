</g>
<!-- fierro -->
<g stroke="#15212B" stroke-width="6" stroke-linecap="round">
<path d="M440 255l300-70" stroke-width="16"/><path d="M440 255l300-70" stroke="#9FB0BB" stroke-width="10"/>
